services:
  postgres:
    image: postgres:17
    container_name: employee_hr_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: employee_hr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee_hr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: